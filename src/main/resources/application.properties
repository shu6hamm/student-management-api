spring.config.import=optional:classpath:application-local.properties
spring.application.name=student-management
server.port=8080

# ---- MySQL connection ----
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_my_sql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update = create tables if missing, add new columns, never drop data
spring.jpa.hibernate.ddl-auto=update
# print generated SQL in the console (useful for learning and viva)
spring.jpa.show-com.shubham.student_management.database.sql=true
spring.jpa.properties.hibernate.format_sql=true
# ---- JWT ----
# Secret must be at least 32 characters (256 bits). Use your own random text.
jwt.secret=student-management-super-secret-key-for-jwt-signing-2026
# Token lifetime: 3600000 ms = 1 hour
jwt.expiration-ms=3600000